<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Кофейня «Зерно»</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
      --text: var(--tg-theme-text-color, #18181b);
      --hint: var(--tg-theme-hint-color, #71717a);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(128, 128, 128, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding: 12px 14px 125px; max-width: 540px; margin: 0 auto; }
    .bonus-header { display: flex; align-items: center; justify-content: space-between; background: var(--sec-bg); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; cursor: pointer; }
    .bonus-shop { font-size: 14px; font-weight: 700; }
    .bonus-badge { background: var(--btn); color: var(--btn-text); padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; }
    .top-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; position: sticky; top: 0; background: var(--bg); padding: 4px 0 8px; z-index: 10; }
    .geo-btn { display: flex; align-items: center; gap: 4px; background: var(--sec-bg); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .search-box { position: relative; flex-grow: 1; }
    .search-box input { width: 100%; background: var(--sec-bg); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px 10px 34px; font-size: 14px; outline: none; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--hint); pointer-events: none; }
    .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .cat-card { background: var(--sec-bg); border: 1px solid var(--border); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: 1 / 1.05; cursor: pointer; overflow: hidden; }
    .cat-card:active { transform: scale(0.97); }
    .cat-title { font-size: 16px; font-weight: 700; }
    .cat-sub { font-size: 12px; color: var(--hint); margin-top: 2px; }
    .cat-img { width: 85%; height: 65%; object-fit: cover; border-radius: 12px; align-self: flex-end; margin-top: auto; }
    .sub-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .back-btn { background: var(--sec-bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .sub-title { font-size: 18px; font-weight: 700; }
    .prod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .prod-card { background: var(--sec-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .prod-card img { width: 100%; height: 115px; object-fit: cover; }
    .prod-body { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .prod-name { font-size: 14px; font-weight: 600; line-height: 1.25; }
    .prod-desc { font-size: 11px; color: var(--hint); margin: 4px 0 8px; }
    .prod-price { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .add-btn { width: 100%; background: var(--btn); color: var(--btn-text); border: none; padding: 8px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .counter { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-radius: 10px; padding: 3px; border: 1px solid var(--border); }
    .counter button { width: 28px; height: 28px; border: none; border-radius: 8px; background: var(--btn); color: var(--btn-text); font-size: 16px; font-weight: 700; cursor: pointer; }
    .counter span { font-size: 13px; font-weight: 600; }
    .bottom-dock { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; max-width: 540px; margin: 0 auto; z-index: 20; }
    .dock-btn { width: 100%; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); text-align: center; }
    .dock-write { background: var(--sec-bg); color: var(--text); }
    .dock-bonus { background: var(--btn); color: var(--btn-text); border: none; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 50; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-sheet { background: var(--bg); color: var(--text); width: 100%; max-width: 540px; border-radius: 20px 20px 0 0; padding: 20px 16px 28px; }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    .modal-text { font-size: 14px; color: var(--hint); line-height: 1.45; margin-bottom: 14px; white-space: pre-line; }
    .map-frame { width: 100%; height: 185px; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    .route-btn { display: block; width: 100%; background: var(--btn); color: var(--btn-text); text-align: center; text-decoration: none; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .modal-close { width: 100%; background: var(--sec-bg); color: var(--text); border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bonus-header" id="btnTopBonus">
    <div class="bonus-shop">Кофейня «Зерно»</div>
    <div class="bonus-badge">🎁 100 баллов</div>
  </div>
  <div class="top-bar">
    <button class="geo-btn" id="btnGeo">📍 Гео</button>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Поиск напитков и еды...">
    </div>
  </div>
  <div id="mainContent"></div>
  <div class="bottom-dock" id="bottomDock">
    <button class="dock-btn dock-write" id="btnWrite">💬 Написать бариста</button>
    <button class="dock-btn dock-bonus" id="btnBonus">🎁 Мои бонусы</button>
  </div>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="modal-title" id="modalTitle"></div>
      <div id="modalMapContainer"></div>
      <div class="modal-text" id="modalText"></div>
      <div id="modalActionContainer"></div>
      <button class="modal-close" id="btnClose">Закрыть</button>
    </div>
  </div> 
    <script>
    const CONFIG = {
      shopName: 'Кофейня «Зерно»',
      address: '📍 г. Минск, ул. Ломоносова, 6\n🕒 Время работы: ежедневно с 07:00 до 19:00',
      lat: 53.9261,
      lon: 27.5936,
      baristaUsername: 'zerno_barista',
      bonusBalance: 100
    };
    const CATEGORIES = [
      { id: 'coffee', title: 'Кофе', sub: 'Классика и авторский', img: 'https://unsplash.com' },
      { id: 'combo', title: 'Комбо', sub: 'Выгодные наборы', img: 'https://unsplash.com' },
      { id: 'iced', title: 'Напитки', sub: 'Айс-кофе и лимонады', img: 'https://unsplash.com' },
      { id: 'food', title: 'Еда', sub: 'Сэндвичи и десерты', img: 'https://unsplash.com' }
    ];
    const PRODUCTS = [
      { id: 1, cat: 'coffee', name: 'Капучино (350 мл)', desc: '100% арабика и плотная пенка', price: 6.00, img: 'https://unsplash.com' },
      { id: 2, cat: 'coffee', name: 'Флэт Уайт (250 мл)', desc: 'Двойной эспрессо с микропеной', price: 6.50, img: 'https://unsplash.com' },
      { id: 3, cat: 'combo', name: 'Круассан + Капучино', desc: 'Идеальный утренний сет', price: 9.50, img: 'https://unsplash.com' },
      { id: 4, cat: 'combo', name: 'Сырники + Американо', desc: 'Домашние сырники со сметаной', price: 11.00, img: 'https://unsplash.com' },
      { id: 5, cat: 'iced', name: 'Айс Латте Карамель', desc: 'Охлаждённый кофе со льдом', price: 7.00, img: 'https://unsplash.com' },
      { id: 6, cat: 'iced', name: 'Эспрессо-тоник', desc: 'Освежающий микс с тоником и лаймом', price: 7.50, img: 'https://unsplash.com' },
      { id: 7, cat: 'food', name: 'Бейгл с индейкой', desc: 'Свежий бейгл, творожный сыр, зелень', price: 8.50, img: 'https://unsplash.com' },
      { id: 8, cat: 'food', name: 'Чизкейк Нью-Йорк', desc: 'Классический сливочный десерт', price: 7.50, img: 'https://unsplash.com' }
    ];
    let cart = {};
    let activeCat = null;
    let searchQuery = '';

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render() {
      const container = document.getElementById('mainContent');
      container.innerHTML = '';

      if (searchQuery.trim() !== '') {
        const filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
        const head = el('div', 'sub-header');
        head.appendChild(el('div', 'sub-title', 'Найдено (' + filtered.length + ')'));
        container.appendChild(head);
        container.appendChild(buildProductGrid(filtered));
        return;
      }

      if (activeCat) {
        const catObj = CATEGORIES.find(c => c.id === activeCat);
        const filtered = PRODUCTS.filter(p => p.cat === activeCat);
        const head = el('div', 'sub-header');
        const back = el('button', 'back-btn', '← Назад');
        back.onclick = function() { activeCat = null; render(); };
        head.appendChild(back);
        head.appendChild(el('div', 'sub-title', catObj.title));
        container.appendChild(head);
        container.appendChild(buildProductGrid(filtered));
        return;
      }

      const grid = el('div', 'cat-grid');
      CATEGORIES.forEach(c => {
        const card = el('div', 'cat-card');
        const info = el('div');
        info.appendChild(el('div', 'cat-title', c.title));
        info.appendChild(el('div', 'cat-sub', c.sub));
        const img = el('img', 'cat-img');
        img.src = c.img;
        img.alt = c.title;
        card.appendChild(info);
        card.appendChild(img);
        card.onclick = function() { activeCat = c.id; render(); };
        grid.appendChild(card);
      });
      container.appendChild(grid);
    }

    function buildProductGrid(list) {
      if (list.length === 0) {
        const empty = el('p', '', 'Ничего не найдено 😔');
        empty.style.color = 'var(--hint)';
        return empty;
      }
      const grid = el('div', 'prod-grid');
      list.forEach(p => {
        const card = el('div', 'prod-card');
        const img = el('img');
        img.src = p.img;
        img.alt = p.name;
        const body = el('div', 'prod-body');
        const top = el('div');
        top.appendChild(el('div', 'prod-name', p.name));
        top.appendChild(el('div', 'prod-desc', p.desc));
        const bottom = el('div');
        bottom.appendChild(el('div', 'prod-price', p.price.toFixed(2) + ' BYN'));

        const q = cart[p.id] || 0;
        if (q === 0) {
          const addBtn = el('button', 'add-btn', '+ В корзину');
          addBtn.onclick = function() { changeQty(p.id, 1); };
          bottom.appendChild(addBtn);
        } else {
          const cnt = el('div', 'counter');
          const minus = el('button', '', '−');
          minus.onclick = function() { changeQty(p.id, -1); };
          const span = el('span', '', q + ' шт');
          const plus = el('button', '', '+');
          plus.onclick = function() { changeQty(p.id, 1); };
          cnt.appendChild(minus);
          cnt.appendChild(span);
          cnt.appendChild(plus);
          bottom.appendChild(cnt);
        }

        body.appendChild(top);
        body.appendChild(bottom);
        card.appendChild(img);
        card.appendChild(body);
        grid.appendChild(card);
      });
      return grid;
    }

    function changeQty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      render();
      updateTgMainButton();
    }

    function openModal(type) {
      const title = document.getElementById('modalTitle');
      const text = document.getElementById('modalText');
      const mapBox = document.getElementById('modalMapContainer');
      const actionBox = document.getElementById('modalActionContainer');
      mapBox.innerHTML = '';
      actionBox.innerHTML = '';

      if (type === 'geo') {
        title.textContent = CONFIG.shopName;
        const frameWrap = el('div', 'map-frame');
        const iframe = el('iframe');
        iframe.width = '100%';
        iframe.height = '100%';
        iframe.frameBorder = '0';
        const bbox = (CONFIG.lon - 0.005) + '%2C' + (CONFIG.lat - 0.003) + '%2C' + (CONFIG.lon + 0.005) + '%2C' + (CONFIG.lat + 0.003);
        iframe.src = 'https://openstreetmap.org' + bbox + '&layer=mapnik&marker=' + CONFIG.lat + '%2C' + CONFIG.lon;
        frameWrap.appendChild(iframe);
        mapBox.appendChild(frameWrap);

        text.textContent = CONFIG.address;
        const link = el('a', 'route-btn', '🗺 Открыть в Яндекс.Картах');
        link.href = 'https://yandex.by' + CONFIG.lon + ',' + CONFIG.lat + '&z=17&l=map';
        link.target = '_blank';
        actionBox.appendChild(link);
      } else if (type === 'bonus') {
        title.textContent = '🎁 Программа лояльности';
        text.textContent = '• Ваш баланс: ' + CONFIG.bonusBalance + ' баллов\n• Курс: 100 баллов = 1 BYN\n• Кэшбэк с каждого заказа: 10%\n\nСписать баллы можно сразу после оформления корзины!';
      } else if (type === 'write') {
        title.textContent = '💬 Связь с бариста';
        text.textContent = 'Есть вопрос по заказу или хотите уточнить наличие десертов? Напишите нам напрямую в Telegram: @' + CONFIG.baristaUsername;
      }

      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function updateTgMainButton() {
      if (!window.Telegram || !window.Telegram.WebApp) return;
      const tg = window.Telegram.WebApp;
      const dock = document.getElementById('bottomDock');
      let total = 0;
      for (const id in cart) {
        const item = PRODUCTS.find(p => p.id == id);
        if (item) total += item.price * cart[id];
      }
      if (total > 0) {
        dock.style.paddingBottom = '64px';
        tg.MainButton.setText('ОФОРМИТЬ ЗАКАЗ • ' + total.toFixed(2) + ' BYN');
        tg.MainButton.show();
      } else {
        dock.style.paddingBottom = '14px';
        tg.MainButton.hide();
      }
    }

    document.getElementById('btnGeo').onclick = function() { openModal('geo'); };
    document.getElementById('btnBonus').onclick = function() { openModal('bonus'); };
    document.getElementById('btnTopBonus').onclick = function() { openModal('bonus'); };
    document.getElementById('btnWrite').onclick = function() { openModal('write'); };
    document.getElementById('btnClose').onclick = closeModal;
    document.getElementById('modalOverlay').onclick = function(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    };
    document.getElementById('searchInput').oninput = function(e) {
      searchQuery = e.target.value;
      render();
    };

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.MainButton.onClick(function() {
        let items = [];
        let total = 0;
        for (const id in cart) {
          const item = PRODUCTS.find(p => p.id == id);
          if (item) {
            items.push(item.name + ' x' + cart[id]);
            total += item.price * cart[id];
          }
        }
        tg.sendData(JSON.stringify({
          items: items.join(', '),
          total: Number(total.toFixed(2))
        }));
      });
    }

    render();
  </script>
</body>
